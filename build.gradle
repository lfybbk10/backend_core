plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'gg.jte.gradle' version '3.1.15'
    id 'org.springframework.boot' version '4.0.1'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.openapi.generator' version '7.21.0'  // Добавить эту строку
}

application {
    mainClass = 'ru.mentee.power.crm.Main'
}

group = 'ru.mentee.power'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    servletOnly
}

ext {
    junitVersion = '5.11.0'
    assertjVersion = '3.26.3'
    lombokVersion = '1.18.40'
    servletVersion = '6.1.0'
    tomcatVersion = '11.0.1'
    jteVersion = '3.1.15'
    springBootVersion = '3.2.0'
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'

    // OpenAPI и документация (Sprint 8)
    openApiGeneratorVersion = '7.1.0'
    springdocVersion = '3.0.2'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation("org.junit.platform:junit-platform-launcher:1.13.4")

    // Lombok (для демонстрации, не используется в Sprint 1)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Mockito для тестов
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'

    constraints {
        testImplementation("net.bytebuddy:byte-buddy:1.17.5")
        testImplementation("net.bytebuddy:byte-buddy-agent:1.17.5")
    }

    servletOnly "jakarta.servlet:jakarta.servlet-api:${servletVersion}"
    servletOnly "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"

    //implementation "gg.jte:jte:${jteVersion}"
    //implementation "gg.jte:jte-runtime:${jteVersion}"

    // Sprint 5: Spring Boot Stack (BCORE-14)
    implementation platform("org.springframework.boot:spring-boot-dependencies:4.0.1")
    implementation "org.springframework.boot:spring-boot-starter-web"

    implementation "gg.jte:jte-spring-boot-starter-3:3.1.15"

    testImplementation "org.springframework.boot:spring-boot-starter-test"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"

    implementation "jakarta.validation:jakarta.validation-api"
    implementation "org.hibernate.validator:hibernate-validator"

    // PostgreSQL JDBC Driver (для dev и production)
    runtimeOnly 'org.postgresql:postgresql'

    // H2 Database (только для тестов)
    testRuntimeOnly 'com.h2database:h2:2.3.232'

    testRuntimeOnly 'org.springframework.boot:spring-boot-h2console'


    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation("org.springframework.boot:spring-boot-starter-data-jpa-test")

    implementation 'org.springframework.boot:spring-boot-liquibase'
    implementation 'org.liquibase:liquibase-core'

    // WireMock для интеграционных тестов внешних API
    testImplementation 'org.wiremock:wiremock-standalone:3.4.2'

    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // Spring Cloud OpenFeign для декларативных HTTP клиентов
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:5.0.1'

    // Resilience4j для retry, circuit breaker, rate limiter
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-feign:2.4.0'

    // lombok-mapstruct-binding (критически важно!)
    implementation "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"

    // MapStruct (должен быть после Lombok в annotationProcessor)
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Sprint 8: OpenAPI документация
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
}
jte {
    sourceDirectory = file("src/main/jte").toPath()
    contentType = "Html"
    binaryStaticContent = false
}

spotless {
    java {
        target 'src/**/*.java'
        targetExclude 'build/**'
        googleJavaFormat('1.35.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
def openApiSpec = file("src/main/resources/api/api-spec.yaml")

openApiGenerate {
    generatorName = "spring"
    inputSpec = "file:///${openApiSpec.absolutePath.replace('\\', '/')}"
    outputDir = "${buildDir}/generated"
    apiPackage = "ru.mentee.power.crm.spring.rest.generated"
    modelPackage = "ru.mentee.power.crm.spring.dto.generated"
    configOptions = [
            interfaceOnly: "true",
            useTags: "true",
            dateLibrary: "java8",
            useSpringBoot4: "true",
            useJakartaEe: "true",
            openApiNullable: "false",
            documentationProvider: "none"
    ]
}

// Добавить сгенерированные файлы в sourceSets
sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/src/main/java"
        }
    }
}

// Привязать генерацию к компиляции
compileJava.dependsOn tasks.openApiGenerate

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring',
            '-Amapstruct.unmappedTargetPolicy=ERROR'
    ]
}

tasks.named("bootRun") {
    mainClass = 'ru.mentee.power.crm.spring.Application'
    classpath = sourceSets.main.runtimeClasspath - configurations.servletOnly
}

tasks.named("run") {
    classpath += configurations.servletOnly
}